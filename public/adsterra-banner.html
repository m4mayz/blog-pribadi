        <script>
            // Use ResizeObserver to detect when the ad loads and resizes the container
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const newHeight = entry.target.scrollHeight || entry.contentRect.height;
                    if (newHeight > 0) {
                        window.parent.postMessage({
                            type: 'adsterra-resize',
                            height: newHeight
                        }, '*');
                    }
                }
            });
            // We observe the body because Adsterra Native Banner expands it
            ro.observe(document.body);
        </script>
